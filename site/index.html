<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Engineering Portfolio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      max-width: 560px;
      padding: 40px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      background: #1e293b;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Deployed with CloudFormation</h1>
    <p>This static site is hosted on Amazon S3 and served globally through CloudFront &mdash; the entire infrastructure is defined as code in a single CloudFormation template.</p>
    <div class="badge">Project 1 &middot; AWS Cloud Engineering Series</div>
  </div>
</body>
</html>
